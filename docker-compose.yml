version: '3.8'

# ============================================================
# BloodLink Docker Compose — Self-Hosted / VPS / Local
# Credentials must be set in a local .env file.
# Never commit .env to version control.
# ============================================================

services:
  bloodlink-backend:
    build:
      context: ./bloodlink-backend
      dockerfile: Dockerfile
    container_name: bloodlink-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      - MATCHING_RADIUS_KM=${MATCHING_RADIUS_KM:-50.0}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}

  bloodlink-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api}
        - VITE_WS_URL=${VITE_WS_URL:-http://localhost:8080/ws}
    container_name: bloodlink-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - bloodlink-backend
