# ============================================================
# BloodLink — Local Development Profile (application-local.properties)
# In-memory H2 database with demo account seeding for local testing.
# ============================================================
spring.application.name=bloodlink-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:bloodlink_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.matching.radius-km=50.0

# Pre-seed demo accounts (admin@bloodlink.local, requester@bloodlink.local, donor@bloodlink.local)
app.seed.demo-data=true
