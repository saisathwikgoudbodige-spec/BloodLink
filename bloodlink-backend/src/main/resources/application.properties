spring.application.name=bloodlink-backend
server.port=${PORT:8080}

# ============================================================
# Neon PostgreSQL Datasource Configuration
# Credentials must be supplied via environment variables.
# No plaintext fallback credentials are permitted.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings (tuned for Neon serverless)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate Safe Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
# jwt.secret must be provided via environment variable in production
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Application CORS Settings
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Matching Engine Configuration
app.matching.radius-km=${MATCHING_RADIUS_KM:50.0}

# Demo Data Seeding (set to false in production to skip demo account creation)
app.seed.demo-data=${SEED_DEMO_DATA:false}
