# Test Configuration — Isolated in-memory H2 database for automated tests.
# This file is loaded by Spring Boot during test execution (test scope only).
# Never use production credentials here.
spring.datasource.url=jdbc:h2:mem:bloodlink_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Randomized test-only JWT secret (not used in production)
jwt.secret=746573742D6A77742D7365637265742D6B65792D666F722D626C6F6F646C696E6B2D6175746F6D617465642D74657374732D6F6E6C79
jwt.expiration=86400000

app.matching.radius-km=50.0
app.seed.demo-data=false
